<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BRUET KEVIN — Contact</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2305080f'/%3E%3Ctext x='50' y='70' font-size='55' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EKB.%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="section-dark">
  <nav class="navbar fixed-navbar">
    <div class="container nav-container">
      <div class="nav-left" style="display: flex; align-items: baseline; gap: 30px;">
        <a href="index.html" class="logo"><span class="logo-letters" data-text="KB">KB</span><span class="logo-dot">.</span></a>
        <a href="#" id="lang-btn" class="logo" style="font-size: 1.2rem; color: var(--text-muted);"><span class="logo-letters" id="lang-toggle-text" data-text="EN">EN</span></a>
      </div>
      <div class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></div>
      <div class="nav-links" id="nav-links">
        <a href="index.html"></a>
        <a href="profil.html"></a>
        <a href="skills.html"></a>
        <a href="projects.html"></a>
        <a href="contact.html" class="active-link"></a>
        <div class="nav-socials">
          <a href="https://linkedin.com/in/Kevin-bruet" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-linkedin"></i></a>
          <a href="https://github.com/Kevinepitech-oss" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i></a>
        </div>
      </div>
    </div>
  </nav>
  <main>
    <header class="page-header reveal">
      <h1 id="contact-header-title"></h1>
      <p id="contact-header-subtitle"></p>
      <a href="#content-start" class="scroll-indicator" id="scroll-indicator"><i class="fa-solid fa-chevron-down"></i></a>
    </header>
    <section id="content-start" class="section-dark reveal">
      <div class="container">
        <div class="contact-grid">
          <form id="contact-form" class="contact-form">
            <h3 id="form-title"></h3>
            <div class="form-group"><label id="label-email"></label><input type="email" name="email" id="input-email" required></div>
            <div class="form-group"><label id="label-message"></label><textarea name="message" id="input-message" required rows="6"></textarea></div>
            <button type="submit" class="btn-primary" id="btn-submit" style="width: 100%; font-size: 1.1rem; padding: 15px;"></button>
            <p id="form-status"></p>
          </form>
          <div class="contact-info-card">
            <h3 id="info-title"></h3>
            <p id="info-intro" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; line-height: 1.6;"></p>
            <div id="dynamic-contact-info" class="contact-links-grid"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer"><p></p></footer>
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
